name: Opus 4.5 evidence

on:
  pull_request:
    branches: [reviewer-release]
  push:
    branches: ['corrections/opus45-evidence-*']

permissions:
  contents: read

jobs:
  offline-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11.0.25+9'
      - name: Verify evidence and derived report
        run: python3 experiments/opus45-20261004/reproduce.py --check
      - name: Verify independent reference checks and derived outcomes
        run: python3 experiments/opus45-20261004/reduce_semantics.py --allow-partial --check
      - name: Complete workflow and strict parser regressions
        run: python3 -m unittest discover -s experiments/opus45-20261004 -p 'test_*.py' -v
      - name: Validate with Python assertions disabled
        run: python3 -O -m unittest discover -s experiments/opus45-20261004 -p 'test_*.py' -v
      - name: Reproduce historical tables
        run: python3 reproduce.py --clean
